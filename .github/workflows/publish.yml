name: Publish to npm

# Triggers on v1.* tags ONLY. v0.x tags are local-only — npm publish
# is deferred to v1.0 (see CLAUDE.md "Current scope" + decisions R6).
#
# When a v1.* tag is pushed:
#   1. Build + full test suite + tarball gate + postinstall audit.
#   2. npm publish --provenance --access public.
#      --provenance generates an OIDC-attested provenance statement
#      tying the published tarball cryptographically to this workflow
#      run + this exact commit SHA. Owners can verify via
#      `npm view magpie-mcp --json | jq .provenance`.
#
# Manual run: workflow_dispatch with a tag input — for emergency
# republish of a specific tag. Default branch publish is NOT supported.

on:
  push:
    tags:
      - 'v1.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v1.* tag to republish (must already exist)'
        required: true
        type: string

# Least-privilege permissions per job.
# id-token: write — required by npm publish --provenance (OIDC attestation).
# contents: read — checkout the tagged commit.
permissions:
  contents: read

jobs:
  publish:
    name: Build · test · publish
    runs-on: ubuntu-latest
    # Provenance attestation requires id-token at job scope, not workflow scope.
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/magpie-mcp
    steps:
      # SHA-pinned per v0.9.2 Phase B/S4 (supply-chain hardening).
      # No fork-runnable jobs in this workflow, but the pin is still
      # the load-bearing defense if an upstream tag is ever moved.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit + e2e tests
        run: npm run test:all

      - name: Tarball gate (S1)
        run: npm run check:tarball

      - name: Postinstall audit (S2)
        run: npm run audit:postinstall

      - name: npm audit (prod, high+) (S5)
        run: npm run audit:deps

      - name: Generate SBOM (S5)
        run: npm run sbom

      - name: Verify tag matches package.json version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version v$PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload SBOM as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.json
          if-no-files-found: error
          retention-days: 90
